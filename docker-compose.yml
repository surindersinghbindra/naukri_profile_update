services:
  # ── PostgreSQL Database Service ─────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: naukri-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-naukri_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-naukri_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-naukri_secure_password_123}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-naukri_user} -d ${POSTGRES_DB:-naukri_analytics}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Profile 1 Automation Service ─────────────────────────────
  updater-profile1:
    build: .
    container_name: naukri-updater-profile1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - ./profiles/profile_1/.env

    volumes:
      - ./profiles/profile_1/resumes:/app/resumes:ro
      - ./profiles/profile_1/resumes:/app/profiles/profile_1/resumes:ro
      - ./logs/profile_1:/app/logs/profile_1
      - ./profiles/profile_1/session_storage:/app/profiles/profile_1/session_storage

    environment:
      - PROFILE_ID=profile_1
      - TZ=Asia/Kolkata
      - PYTHONUNBUFFERED=1
      - POSTGRES_HOST=postgres

    shm_size: "256m"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  # ── Profile 2 Automation Service ─────────────────────────────
  updater-profile2:
    build: .
    container_name: naukri-updater-profile2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - ./profiles/profile_2/.env

    volumes:
      - ./profiles/profile_2/resumes:/app/resumes:ro
      - ./profiles/profile_2/resumes:/app/profiles/profile_2/resumes:ro
      - ./logs/profile_2:/app/logs/profile_2
      - ./profiles/profile_2/session_storage:/app/profiles/profile_2/session_storage

    environment:
      - PROFILE_ID=profile_2
      - TZ=Asia/Kolkata
      - PYTHONUNBUFFERED=1
      - POSTGRES_HOST=postgres

    shm_size: "256m"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  # ── Streamlit Analytics Dashboard Service ────────────────────
  dashboard:
    build: .
    container_name: naukri-analytics-dashboard
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

    entrypoint: ["streamlit", "run", "dashboard.py", "--server.port=8501", "--server.address=0.0.0.0"]

    ports:
      - "8501:8501"

    volumes:
      - ./logs:/app/logs
      - ./profiles:/app/profiles

    environment:
      - POSTGRES_HOST=postgres
      - PYTHONUNBUFFERED=1
