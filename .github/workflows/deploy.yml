name: 🚀 Deploy Naukri Profile Updater & Dashboard

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: 📦 Pull Code & Rebuild Docker Stack
    runs-on: ubuntu-latest

    steps:
      - name: 🔐 SSH Remote Deployment & Docker Compose Update
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "🚀 Starting Deployment on Server..."
            cd ${{ secrets.SERVER_PROJECT_PATH || '~/naukri_profile_update' }}

            echo "📦 Fetching latest code from git..."
            git pull origin ${{ github.ref_name }}

            echo "🐳 Stopping current containers..."
            docker compose down

            echo "🏗️ Rebuilding and starting Docker services..."
            docker compose up -d --build

            echo "🔍 Verifying running container status..."
            docker compose ps

            echo "🎉 Deployment successful!"
